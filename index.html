<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161313">
  <meta name="description" content="Save the date — South Okanagan">
  <title>Save the date — South Okanagan</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #161313;
    }
    .card {
      position: relative;
      width: min(100vw, 46.2085dvh, 780px);
      aspect-ratio: 780 / 1688;
      overflow: hidden;
      isolation: isolate;
      box-shadow: 0 12px 50px rgb(0 0 0 / 25%);
    }
    .artwork {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
    .countdown {
      position: absolute;
      z-index: 1;
      top: 82.2%;
      left: 5%;
      width: 90%;
      height: 6.35%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      text-align: center;
      color: #f5e9e9;
      background-color: #76000b;
      background-image:
        repeating-linear-gradient(0deg, rgb(255 255 255 / 1.3%) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgb(0 0 0 / 3%) 0 1px, transparent 1px 4px),
        linear-gradient(110deg, rgb(255 255 255 / 2%), transparent 45%, rgb(0 0 0 / 4%));
    }
    .digit {
      display: block;
      white-space: nowrap;
      font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(22px, 6.2vw, 48px);
      font-style: italic;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -.06em;
      transform: scaleX(.72);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 1px rgb(0 0 0 / 12%);
    }
    @media (prefers-reduced-motion: reduce) {
      .digit { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Save the date — South Okanagan">
    <img class="artwork" src="assets/card-original.png" alt="Свадебная карточка с фотографиями пары, именами и надписью Save the date — South Okanagan">
    <div class="countdown" aria-label="Countdown">
      <span class="digit" id="days" aria-label="Days">--</span>
      <span class="digit" id="hours" aria-label="Hours">--</span>
      <span class="digit" id="minutes" aria-label="Minutes">--</span>
      <span class="digit" id="seconds" aria-label="Seconds">--</span>
    </div>
  </main>
  <script src="event-config.js"></script>
  <script>
    (() => {
      const config = window.EVENT_CONFIG || {};
      const digits = {
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds'),
      };
      const datePattern = /^\d{4}-\d{2}-\d{2}$/;
      const timePattern = /^\d{2}:\d{2}$/;

      function eventInstant(date, time, timeZone) {
        if (!datePattern.test(date) || !timePattern.test(time) || !timeZone) return null;
        const [year, month, day] = date.split('-').map(Number);
        const [hour, minute] = time.split(':').map(Number);
        const intended = Date.UTC(year, month - 1, day, hour, minute);
        const check = new Date(intended);
        if (check.getUTCFullYear() !== year || check.getUTCMonth() !== month - 1 ||
            check.getUTCDate() !== day || hour > 23 || minute > 59) return null;

        try {
          const formatter = new Intl.DateTimeFormat('en-US', {
            timeZone, year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
          });
          let instant = intended;
          for (let i = 0; i < 4; i++) {
            const parts = Object.fromEntries(formatter.formatToParts(new Date(instant))
              .filter(part => part.type !== 'literal')
              .map(part => [part.type, Number(part.value)]));
            const observed = Date.UTC(parts.year, parts.month - 1, parts.day,
              parts.hour, parts.minute, parts.second);
            instant += intended - observed;
          }
          return instant;
        } catch (_) {
          return null;
        }
      }

      const target = eventInstant(config.date, '00:00', config.timeZone);
      if (target === null) return;

      function update() {
        let remaining = Math.max(0, target - Date.now());
        const days = Math.floor(remaining / 86400000);
        remaining %= 86400000;
        const hours = Math.floor(remaining / 3600000);
        remaining %= 3600000;
        const minutes = Math.floor(remaining / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);
        digits.days.textContent = String(days).padStart(2, '0');
        digits.hours.textContent = String(hours).padStart(2, '0');
        digits.minutes.textContent = String(minutes).padStart(2, '0');
        digits.seconds.textContent = String(seconds).padStart(2, '0');
      }
      update();
      window.setInterval(update, 1000);
    })();
  </script>
</body>
</html>
